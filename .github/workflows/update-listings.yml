name: Update eBay listings

on:
  schedule:
    # 13:00 UTC = 9am US Eastern / 8am US Central. Adjust to taste.
    - cron: '0 13 * * *'
  workflow_dispatch: {} # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update-listings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch listings from eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
        run: node scripts/fetch-listings.mjs

      - name: Commit updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git diff --staged --quiet || git commit -m "Update eBay listings"
          git push
